name: Valider les calculateurs de transport

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer pytest
        run: python -m pip install --upgrade pip pytest
      - name: Valider les fichiers JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = list(Path('methodes/planification-trajets-montreal/donnees').glob('*.json'))
          for path in files:
              with path.open(encoding='utf-8') as stream:
                  json.load(stream)
              print(f'JSON valide : {path}')
          PY
      - name: Exécuter les tests des calculateurs
        run: pytest -q methodes/planification-trajets-montreal/tests
