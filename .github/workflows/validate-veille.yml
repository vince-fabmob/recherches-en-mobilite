name: Valider la veille stratégique

on:
  push:
    paths:
      - 'veille-strategique/**'
      - 'scripts/validate_veille.py'
      - 'requirements-dev.txt'
  pull_request:
    paths:
      - 'veille-strategique/**'
      - 'scripts/validate_veille.py'
      - 'requirements-dev.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Valider les fiches de veille
        run: python scripts/validate_veille.py
